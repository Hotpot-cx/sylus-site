<!doctype html>
<html lang="zh-CN" class="theme-abyss">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>牵手 · 光手背景实验 | 秦彻</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&family=Noto+Sans+SC:wght@200;300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #040308;
        color: #ece9ef;
        font-family: "Noto Sans SC", sans-serif;
        overflow-x: hidden;
      }
      .stage {
        position: relative;
        min-height: 100svh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(90% 70% at 50% 52%, #0b0510 0%, #040308 72%);
      }

      /* 光手序列层 */
      .hands {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      .hands img {
        position: absolute;
        left: 50%;
        top: 44%;
        width: min(1180px, 100vw);
        height: auto;
        transform: translate(-50%, -50%) scale(1.02);
        mix-blend-mode: screen;
        opacity: 0;
        will-change: opacity, transform;
        user-select: none;
        -webkit-user-drag: none;
      }
      /* 柔光层（同一批图，CSS 模糊） */
      .hands-soft {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        filter: blur(30px) saturate(1.05);
        opacity: 0.36;
        mix-blend-mode: screen;
      }
      .hands-soft img {
        position: absolute;
        left: 50%;
        top: 44%;
        width: min(1180px, 100vw);
        height: auto;
        transform: translate(-50%, -50%) scale(1.03);
        opacity: 0;
        will-change: opacity;
        user-select: none;
      }

      /* 牵手瞬间的光点 */
      .spark {
        position: absolute;
        left: 50%;
        top: 47%;
        z-index: 2;
        width: 34vw;
        height: 34vw;
        transform: translate(-50%, -50%) scale(0.9);
        background: radial-gradient(
          circle,
          rgba(255, 244, 248, 0.55),
          rgba(255, 170, 190, 0.18) 42%,
          transparent 70%
        );
        filter: blur(16px);
        mix-blend-mode: screen;
        opacity: 0;
        pointer-events: none;
      }

      .veil {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background:
          radial-gradient(115% 95% at 50% 50%, transparent 30%, rgba(4, 3, 8, 0.8) 84%),
          linear-gradient(
            180deg,
            rgba(4, 3, 8, 0.78),
            transparent 22%,
            transparent 68%,
            rgba(4, 3, 8, 0.92)
          );
      }
      .grain {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        opacity: 0.16;
        mix-blend-mode: overlay;
        background-image: repeating-linear-gradient(
            -45deg,
            rgba(255, 255, 255, 0.06) 0 1px,
            transparent 1px 3px
          ),
          repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.08) 0 1px, transparent 1px 3px);
      }

      /* 文案 */
      .copy {
        position: absolute;
        left: 0;
        right: 0;
        bottom: clamp(60px, 9vh, 110px);
        z-index: 4;
        text-align: center;
        padding: 0 22px;
        pointer-events: none;
      }
      .copy::before {
        content: "";
        position: absolute;
        inset: -170px 0 -90px;
        z-index: -1;
        background: linear-gradient(
          to top,
          rgba(4, 3, 8, 0.94) 0%,
          rgba(4, 3, 8, 0.72) 42%,
          rgba(4, 3, 8, 0) 100%
        );
        pointer-events: none;
      }
      .copy .k {
        font-family: "DM Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.46em;
        text-transform: uppercase;
        color: rgba(255, 148, 164, 0.85);
      }
      .copy h1 {
        margin: 18px 0 0;
        font-family: "Cormorant Garamond", serif;
        font-weight: 300;
        font-size: clamp(34px, 6.2vw, 90px);
        line-height: 1.04;
        letter-spacing: 0.02em;
        color: #fff;
        text-shadow: 0 0 80px rgba(255, 220, 230, 0.28);
      }
      .copy h1 em {
        font-style: italic;
        color: #ffd3db;
      }
      .copy p {
        margin: 18px auto 0;
        max-width: 460px;
        font-size: 12px;
        line-height: 2;
        letter-spacing: 0.1em;
        color: rgba(232, 226, 236, 0.58);
      }
      .copy p b {
        color: rgba(255, 210, 220, 0.9);
        font-weight: 400;
      }

      .back {
        position: fixed;
        left: 16px;
        top: 14px;
        z-index: 9;
        font-family: "DM Mono", monospace;
        font-size: 9.5px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(236, 233, 239, 0.55);
        text-decoration: none;
        border-bottom: 1px solid rgba(255, 107, 125, 0.35);
        padding-bottom: 2px;
      }
      .back:hover { color: #fff; }
      .note {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        z-index: 9;
        font-family: "DM Mono", monospace;
        font-size: 9px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #0e0409;
        background: #e8394f;
        padding: 7px 14px;
        white-space: nowrap;
      }
      @media (max-width: 760px) {
        .hands img,
        .hands-soft img {
          width: 165vw;
        }
        .copy h1 { font-size: clamp(30px, 9vw, 44px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .hands-soft { display: none; }
      }
    </style>
  </head>
  <body>
    <a class="back" href="index.html">← 返回主站</a>

    <section class="stage">
      <div class="hands-soft" aria-hidden="true">
        <img data-f="0" src="images/hands_f1.webp" alt="" />
        <img data-f="1" src="images/hands_f2.webp" alt="" />
        <img data-f="2" src="images/hands_f3.webp" alt="" />
        <img data-f="3" src="images/hands_f4.webp" alt="" />
      </div>
      <div class="hands" aria-hidden="true">
        <img data-f="0" src="images/hands_f1.webp" alt="" />
        <img data-f="1" src="images/hands_f2.webp" alt="" />
        <img data-f="2" src="images/hands_f3.webp" alt="" />
        <img data-f="3" src="images/hands_f4.webp" alt="" />
      </div>
      <div class="spark" id="spark" aria-hidden="true"></div>
      <div class="veil" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <div class="copy">
        <div class="k">Almost touching · 02</div>
        <h1>Hold on <em>to me.</em></h1>
        <p>
          左手（他）· 右手（你）<br />
          <b>靠近 → 停住 → 退开</b>，14.4 秒循环；四帧交叉溶解
        </p>
      </div>
    </section>

    <div class="note">背景实验 · 牵手（男左女右）</div>

    <script>
      (function () {
        var SLOT = 1.8;
        var SEQ = [0, 1, 2, 3, 3, 2, 1, 0];
        var N = SEQ.length;
        var CYCLE = N * SLOT;
        var sharp = [].slice.call(document.querySelectorAll(".hands img"));
        var softEls = [].slice.call(document.querySelectorAll(".hands-soft img"));
        var spark = document.getElementById("spark");
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function tri(x, c, w) {
          var d = Math.abs(x - c) / w;
          var v = Math.max(0, 1 - d);
          return v * v * (3 - 2 * v);
        }

        function weights(p) {
          var out = [0, 0, 0, 0];
          for (var j = 0; j < N; j++) {
            var w = tri(p, j + 0.5, 1.15);
            var f = SEQ[j];
            if (w > out[f]) out[f] = w;
          }
          var sum = out.reduce(function (a, b) { return a + b; }, 0) || 1;
          if (sum > 1) out = out.map(function (v) { return v / sum; });
          return out;
        }

        function frame(t) {
          var p = (t / SLOT) % N;
          var w = weights(p);
          for (var i = 0; i < 4; i++) {
            sharp[i].style.opacity = w[i].toFixed(3);
            softEls[i].style.opacity = w[i].toFixed(3);
          }
          var ap = p <= 3 ? p / 3 : p <= 4.6 ? 1 : Math.max(0, (N - p) / (N - 4.6));
          ap = Math.min(1, Math.max(0, ap));
          var s = (1.0 + ap * 0.045).toFixed(4);
          for (var k = 0; k < 4; k++) {
            sharp[k].style.transform = "translate(-50%, -50%) scale(" + s + ")";
          }
          var glow = Math.max(tri(p, 3.5, 1.25), tri(p, 4.5, 1.25));
          spark.style.opacity = (glow * 0.85).toFixed(3);
          spark.style.transform =
            "translate(-50%, -50%) scale(" + (0.86 + glow * 0.24).toFixed(3) + ")";
        }

        if (reduce) {
          for (var i = 0; i < 4; i++) {
            sharp[i].style.opacity = i === 3 ? 1 : 0;
            softEls[i].style.opacity = 0;
          }
          return;
        }

        var start = performance.now();
        (function loop(now) {
          frame(((now - start) / 1000) % CYCLE);
          requestAnimationFrame(loop);
        })(start);
      })();
    </script>
  </body>
</html>
